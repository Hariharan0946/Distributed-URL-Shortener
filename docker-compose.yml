services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api1:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://shortener:shortener@postgres:5432/shortener
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://localhost:8080
      WORKER_ID: 1
      NODE_ID: api-node-1
    depends_on:
      - postgres
      - redis

  api2:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://shortener:shortener@postgres:5432/shortener
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://localhost:8080
      WORKER_ID: 2
      NODE_ID: api-node-2
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2

volumes:
  postgres_data:

