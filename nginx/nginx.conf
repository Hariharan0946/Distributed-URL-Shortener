events {}

http {
    upstream shortener_backend {
        server api1:8000;
        server api2:8000;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://shortener_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

